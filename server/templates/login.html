<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyTimeLogger 登录</title>
  <style>
    :root { color-scheme:light dark; --bg:#f4f3f8; --card:#fff; --text:#202231; --muted:#73768a; --line:#e1dfe9; --purple:#9b3ae8; --blue:#3a7ee8; --danger:#c53d4a; }
    @media (prefers-color-scheme:dark) { :root { --bg:#16161c; --card:#20202b; --text:#eceaf0; --muted:#a3a1b0; --line:#33334a; --danger:#ff8290; } }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:"PingFang SC","Noto Sans SC",system-ui,sans-serif; padding:18px; }
    main { width:min(524px,100%); background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; box-shadow:0 10px 28px #0002; }
    h1 { margin:0 0 6px; font-size:24px; }
    p { margin:0 0 16px; color:var(--muted); }
    input { width:100%; height:44px; margin-bottom:10px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--text); padding:0 12px; font:inherit; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    button { height:42px; border:0; border-radius:10px; font:inherit; font-weight:800; color:white; background:var(--purple); cursor:pointer; }
    button.secondary { background:var(--blue); }
    .entry { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px; }
    .entry a { display:grid; grid-template-rows:auto auto; align-content:center; justify-items:center; min-width:0; min-height:92px; padding:10px 6px; text-align:center; text-decoration:none; color:var(--text); border:1px solid var(--line); border-radius:12px; background:color-mix(in srgb, var(--purple) 10%, transparent); font-weight:800; }
    .entry a span { display:block; font-size:24px; line-height:1; margin-bottom:6px; text-align:center; }
    .status { min-height:20px; margin-top:10px; color:var(--muted); font-size:13px; }
    .account-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 14px; padding:12px; border:1px solid var(--line); border-radius:12px; background:color-mix(in srgb, var(--purple) 7%, transparent); }
    .account-name { display:block; font-size:14px; font-weight:800; } .account-hint { display:block; margin-top:2px; color:var(--muted); font-size:12px; }
    button.logout { flex:0 0 auto; height:34px; padding:0 12px; border:1px solid color-mix(in srgb, var(--danger) 45%, var(--line)); background:transparent; color:var(--danger); font-size:13px; }
    @media (max-width:420px) { .entry { grid-template-columns:1fr; } .account-bar { align-items:flex-start; } }
    main.logged-in .auth-fields { display:none; }
    main.logged-in p { margin-bottom:10px; }
  </style>
</head>
<body>
  <main id="panel">
    <h1>MyTimeLogger</h1>
    <p id="intro">登录后选择服务端调试入口。</p>
    <div class="account-bar" id="account-bar" hidden>
      <div><span class="account-name" id="account-name"></span><span class="account-hint">当前已登录，可切换账号</span></div>
      <button class="logout" id="logout">退出账号</button>
    </div>
    <div class="auth-fields">
      <input id="username" autocomplete="username" placeholder="用户名" />
      <input id="password" type="password" autocomplete="current-password" placeholder="密码" />
      <div class="actions">
        <button id="login">登录</button>
        <button class="secondary" id="register">注册</button>
      </div>
    </div>
    <div class="entry">
      <a href="/exercise"><span>🏋️</span>运动界面</a>
      <a href="/sleep"><span>🌙</span>睡眠界面</a>
      <a href="/config"><span>⚙️</span>配置页面</a>
    </div>
    <div class="status" id="status"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id)
    const params = new URLSearchParams(location.search)
    const next = params.get('next')
    const savedUser = localStorage.getItem('mtl_user') || localStorage.getItem('sleep_user') || ''
    $('username').value = savedUser

    function nextTarget() {
      if (!next) return ''
      const normalized = next.startsWith('/') ? next : `/${next}`
      return ['/exercise', '/sleep', '/config'].includes(normalized) ? normalized : ''
    }

    function setToken(token, username) {
      localStorage.setItem('mtl_token', token)
      localStorage.setItem('sleep_token', token)
      localStorage.setItem('mtl_user', username)
      localStorage.setItem('sleep_user', username)
    }

    function showLoggedIn(username) {
      $('panel').classList.add('logged-in')
      $('account-name').textContent = username
      $('account-bar').hidden = false
      $('intro').textContent = '请选择服务端调试入口。'
      $('status').textContent = '登录成功，可以进入运动、睡眠或配置页面'
    }

    function clearSession() {
      Object.keys(localStorage).filter(key => key.startsWith('mtl_') || key.startsWith('sleep_'))
        .forEach(key => localStorage.removeItem(key))
      $('username').value = ''
      $('password').value = ''
      $('panel').classList.remove('logged-in')
      $('account-name').textContent = ''
      $('account-bar').hidden = true
      $('intro').textContent = '登录后选择服务端调试入口。'
    }

    async function restoreSession() {
      const token = localStorage.getItem('mtl_token') || localStorage.getItem('sleep_token')
      if (!token) return
      try {
        const resp = await fetch('/auth/me', { headers:{Authorization:`Bearer ${token}`} })
        const body = await resp.json().catch(() => ({}))
        const username = body.user && body.user.username
        if (!resp.ok || !username) throw new Error('invalid session')
        showLoggedIn(username)
      } catch (_) {
        clearSession()
      }
    }

    async function auth(register) {
      const username = $('username').value.trim()
      const password = $('password').value
      if (!username || !password) {
        $('status').textContent = '请输入用户名和密码'
        return
      }
      if (register) {
        const created = await fetch('/auth/register', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username, password }) })
        if (!created.ok && created.status !== 400) {
          $('status').textContent = '注册失败'
          return
        }
      }
      const resp = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ username, password }) })
      const body = await resp.json().catch(() => ({}))
      if (!resp.ok || !body.token) {
        $('status').textContent = body.detail || '登录失败'
        return
      }
      setToken(body.token, username)
      showLoggedIn(username)
      const target = nextTarget()
      if (target) location.href = target
    }

    $('login').onclick = () => auth(false)
    $('register').onclick = () => auth(true)
    $('logout').onclick = async () => {
      const token = localStorage.getItem('mtl_token') || localStorage.getItem('sleep_token')
      try {
        if (token) await fetch('/auth/logout', { method:'POST', headers:{Authorization:`Bearer ${token}`} })
      } finally {
        clearSession()
        $('status').textContent = '已退出账号'
      }
    }
    restoreSession()
  </script>
</body>
</html>
